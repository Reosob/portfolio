<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Yarotski</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <canvas class="game-bg" id="gameBg" aria-hidden="true"></canvas>
  <div class="score-board" id="scoreBoard" aria-live="polite">SCORE 000000</div>
  <main class="page">
    <header class="hero" aria-label="Портфолио">
      <div class="eyebrow">BOOT: PORTFOLIO.EXE</div>
      <h1 class="typewriter" id="heroTitle" data-text="Alex Yarotski" aria-label="Alex Yarotski">Alex Yarotski</h1>
      <p class="lead console-line" id="heroLead" data-text="Playable ads | Cocos creator">Playable ads | Cocos creator</p>
      <div class="contacts" aria-label="Contacts">
        <a class="contact-button" href="https://t.me/reosob" target="_blank" rel="noopener noreferrer">Telegram</a>
        <a class="contact-button" href="https://www.linkedin.com/in/alexyarotski/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </header>

    <nav class="filters" aria-label="Фильтр проектов">
      <button class="filter-button is-active" type="button" data-filter="all">All</button>
      <button class="filter-button" type="button" data-filter="2d">2D</button>
      <button class="filter-button" type="button" data-filter="3d">3D</button>
      <button class="filter-button" type="button" data-filter="video">Video</button>
    </nav>

    <section class="grid" id="projectsGrid" aria-label="Список проектов"></section>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <button class="close" type="button" aria-label="Закрыть просмотр">&times;</button>
    <div class="phone-viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe
            id="projectFrame"
            title="Просмотр проекта"
            allow="autoplay; fullscreen"
          ></iframe>
        </div>
      </div>
      <span class="sr-only" id="viewerTitle">Проект</span>
    </div>
  </div>

  <script src="assets/js/projects.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
